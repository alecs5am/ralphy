<script>
const BAYER=[[0,32,8,40,2,34,10,42],[48,16,56,24,50,18,58,26],[12,44,4,36,14,46,6,38],[60,28,52,20,62,30,54,22],[3,35,11,43,1,33,9,41],[51,19,59,27,49,17,57,25],[15,47,7,39,13,45,5,37],[63,31,55,23,61,29,53,21]];
function dither(img,cv){
  const DW=440, DH=Math.round(DW*img.naturalHeight/img.naturalWidth);
  const off=document.createElement("canvas");off.width=DW;off.height=DH;
  const ox=off.getContext("2d");ox.drawImage(img,0,0,DW,DH);
  const d=ox.getImageData(0,0,DW,DH);const p=d.data;
  const contrast=1.32, bias=-22;
  for(let y=0;y<DH;y++)for(let x=0;x<DW;x++){
    const i=(y*DW+x)*4;
    let g=0.299*p[i]+0.587*p[i+1]+0.114*p[i+2];
    g=(g-128)*contrast+128+bias;
    const t=(BAYER[y&7][x&7]+0.5)/64*255;
    const v=g>t?255:0; p[i]=p[i+1]=p[i+2]=v;
  }
  ox.putImageData(d,0,0);
  cv.width=DW;cv.height=DH;const cx=cv.getContext("2d");cx.imageSmoothingEnabled=false;cx.drawImage(off,0,0);
}
function go(o,c){const im=document.getElementById(o);const cv=document.getElementById(c);
  if(im.complete)dither(im,cv);else im.onload=()=>dither(im,cv);}
go("o2","c2");go("o6","c6");go("o10","c10");go("o17","c17");
</script>
