[project]
name = "ralphy"
version = "0.8.0"
description = "Ralphy: a plugin for coding agents that keeps Content and Accounts on plain files, renders HyperFrames, reads trends and the hosted library."
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = [
  "pyyaml>=6.0.2",
  "patchright>=1.52",
]

[project.scripts]
ralphy = "ralphy.cli:main"

[dependency-groups]
dev = [
  "pytest>=8.3",
  "ruff>=0.11",
]

[build-system]
requires = ["uv_build>=0.11.0,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
