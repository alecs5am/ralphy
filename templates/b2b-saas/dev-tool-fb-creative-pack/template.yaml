name: Dev-Tool FB Creative Pack
description: >-
  An N-creative (typically 30+) static Facebook / Meta / IG ad pack for a SaaS /
  dev-tool startup, built as a 5-set creative matrix: A real-people testimonial
  portraits, B graphic / typography posters, C proof / data-viz (charts, code
  cards, dashboards), D meme formats, E niche-audience hooks. The whole pack reads
  on-brand because of two pre-flight disciplines: site-grounding (curl the live
  site's CSS for the REAL hex palette + Playwright-screenshot the hero, NEVER
  sketch brand-DNA from memory) and `--ref` discipline (pass that hero screenshot
  as `--ref` on every single gen so palette + type drift across 30+ distinct
  concepts goes to zero). Each set has a per-set prompt formula — photoreal
  testimonial portrait (Sony A7 IV + Sigma 85mm + Kodak Portra + named imperfection
  + "naturalistic NOT glossy"), strikethrough-price stack, horizontal bar chart,
  macOS-chrome code card, meme header. Baked on `openai/gpt-5.4-image-2` in TRUE
  parallel (the 1-concurrent cap is a stale myth — probe it). Copy ships alongside
  as `ads-copy.md` (primary text + headline + description + CTA per creative,
  number-first hooks). Derived from `sotaocr-fb-001`.
