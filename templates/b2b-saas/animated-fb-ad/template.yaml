name: Animated FB Showcase Reel
description: >-
  A single animated 1:1 square silent motion piece for Facebook / Meta / IG feed —
  a self-promo "showcase reel" for a tool that produces visual outputs, built
  entirely in HyperFrames as ONE opacity-gated GSAP timeline (no sub-compositions).
  Five beats over ~30s: HOOK (mascot + eyebrow + tagline), SHOWCASE WALL (a tiled
  grid of muted pre-rendered output clips proving range), FEATURED (one hero clip +
  the one-prompt claim), STACK (a scrolling marquee of integration logo SVGs — "plugs
  into your stack"), CTA (mascot + wordmark + URL + button). The discipline: reuse
  the tool's OWN already-rendered outputs as the proof wall (zero new model spend),
  drive all video layers MUTED (FB feed auto-mutes — silent by design), gate every
  beat by opacity on a single timeline registered on window.__timelines, and use a
  TIME_SCALE wrapper to stretch a 15s authored storyboard to a 30s render without
  rewriting tween positions. Brand fonts + a single accent + a corner stamp keep it
  on-brand with no AI media generation. Derived from `ralphy-fb-ads-001`.
