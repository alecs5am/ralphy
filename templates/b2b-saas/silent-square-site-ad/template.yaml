name: Silent Square Site Ad
description: >-
  Silent 1:1 square Facebook / Meta feed ad built entirely in HyperFrames from a
  brand's OWN live-site assets — no AI media generation, $0 model spend. The
  composition is one timeline with opacity-gated beats (no sub-compositions): a
  topbar + anchor flash, a color-word manifesto filling the upper dead air, a
  persistent pool of ~12 brand stickers dropped in with a back.out overshoot
  ("just dumped onto the canvas"), article / product cards, a center-pivot
  pendulum element, and a half-canvas color split that uses the centered logo as
  the bridge. The discipline that makes it cheap and on-brand: pull the live
  site's REAL assets first (mask-image SVGs, logos, hero images), read the site's
  own animation CSS keyframes verbatim instead of guessing physics, pre-rasterize
  any vector that scales >2x, and snapshot every beat at its hero frame BEFORE
  rendering. Silent by design (FB feed auto-mutes). Derived from
  `odindoma-fb-ad-001`.
