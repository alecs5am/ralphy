name: Streetwear Drop Poster
description: >-
  Single high-impact 9:16 key-art poster built as a poster-as-landing-page —
  one image that reads as a full product drop page. A fixed vertical
  architecture stacks four parametric slots top-to-bottom: a small tracked
  intro line, a MASSIVE chunky slab-serif wordmark with a 90s-cereal-box 3D
  bevel, a cinematic chest-up hero portrait wearing the brand's own scribbled
  blob mascot, a scattered DIY sticker-collage layer (vinyl stars with
  tape corners + pixel labels), and a bottom copy block (headline + 4 italic
  serif body lines + a CTA pill + a tracked footer strip). Y2K skate-surf
  streetwear register: subtle film grain, slight vignette, CRT warmth, single
  saturated accent locked against a full-bleed gradient. Crisp baked typography
  is the whole point, so gpt-5.4-image-2 is the default. Derived from
  `loud-kids-poster-001` (3 fictional-brand variants: BOOM / DANG / YIKES).
