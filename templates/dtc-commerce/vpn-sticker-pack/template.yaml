name: Mascot Sticker Pack
description: >-
  Full Telegram / messaging sticker pack (~32 die-cut stickers) built around one
  featureless brand mascot. The mascot's identity is locked across every sticker
  via a single neutral master shot passed as `--ref` on every generation, so a
  translucent-jelly / clay / plush character stays on-model across 30+ poses.
  Emotion is carried by POSE + PROP + minimalist eye-marks, never by a literal
  mouth/nose — each sticker reproduces a recognizable chat meme (table-flip,
  this-is-fine, sigma, 4-arms-busy, beg). Generated on flat chroma-green WITHOUT
  a baked outline, then soft-keyed by flood-fill connectivity + Gaussian feather,
  despilled, cropped to the solid bounding box, and scaled to a 512px long side
  (never padded to a square). gemini-3-pro-image holds the character; gpt-5.4-image-2
  is reserved only for the one text-bearing sticker. Two deliverable sets ship from
  one render pass: white-die-cut-outline and clean-silhouette. Derived from
  `free-air-vpn-stickerpack`.
