name: Multi-Style Carousel
description: >-
  A multi-style multi-slide social carousel (5 slides × N aesthetics) where the
  deliverable is the baked-text image itself — no HyperFrames compose, every
  headline and label is rendered INSIDE the image. One brand mascot + one benefit
  arc (hook → problem → how → proof → CTA) is reshot across several distinct looks
  (zine / club / swiss / riso / punk / acid / clean DTC) so the same campaign can
  A/B a dozen visual registers from one copy deck. The discipline that makes it
  cohere and stay cheap: a cover-first checkpoint (generate ONE cover per style,
  user reviews all covers, THEN fill the remaining slides), a dual-ref cohesion
  rule (`--ref mascot --ref {style}-01` on every fill slide so each 5-slide set
  inherits its cover's exact paper/light/grade), a reusable per-style JSON
  STYLE+QUALITY block where only `scene.subject` + `composition.ui_elements` vary
  per slide, and the mascot-fit rule (a clean cute mascot does NOT survive
  gritty/grunge styles — redraw it IN the medium or build a distressed variant).
  Baked on `openai/gpt-5.4-image-2` (the only image model that holds embedded
  typography), serialized at 1 concurrent with transient-network retries. Derived
  from `ralphy-carousel-001`.
