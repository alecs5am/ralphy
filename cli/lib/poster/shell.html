<!doctype html>
<html lang="{{LANG}}">
<head>
<meta charset="utf-8">
<!-- Poster-collage shell (#598). `ralphy editor poster` fills the double-brace placeholders: scene data and engine go into the two inline scripts. -->
<title>{{TITLE}}</title>
<style>
@font-face{font-family:"Oswald";src:url("fonts/oswald.ttf") format("truetype");font-weight:200 700}
@font-face{font-family:"Caveat";src:url("fonts/caveat.ttf") format("truetype");font-weight:400 700}
@font-face{font-family:"Inter";src:url("fonts/inter.ttf") format("truetype");font-weight:100 900}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0D0D0D}
#root{position:relative;width:1080px;height:1920px;overflow:hidden;background:#0D0D0D}
.sc{position:absolute;inset:0;overflow:hidden;opacity:0;transform-origin:50% 45%}
.bg{position:absolute;inset:0;overflow:hidden}
.bg-red{background:#B3201B}
.bg-blue{background:#1F33C4}
.bg-black{background:#0D0D0D}
.bg-navy{background:#0A1A4F}
.bg-paper{background:#F6F4EF}
.bg-white{background:#ECECEA}
.bg-beige{background:#E8DCC2}
.bg-sunset{background:linear-gradient(180deg,#E3532A 0%,#F09A55 30%,#F4D3A0 62%,#EFE2C6 100%)}
.paperimg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.35;mix-blend-mode:multiply;filter:grayscale(1) contrast(1.1) brightness(1.35)}
.rays{position:absolute;left:50%;top:46%;width:3400px;height:3400px;margin:-1700px 0 0 -1700px;background:repeating-conic-gradient(from 0deg,rgba(255,255,255,.075) 0deg 3.5deg,rgba(255,255,255,0) 3.5deg 11deg)}
.bg-black .rays{background:repeating-conic-gradient(from 0deg,rgba(255,255,255,.05) 0deg 1.2deg,rgba(255,255,255,0) 1.2deg 9deg)}
.rays-red{background:repeating-conic-gradient(from 0deg,rgba(185,32,27,.9) 0deg 5deg,rgba(185,32,27,0) 5deg 15deg)!important;top:38%}
.title{position:absolute;text-align:center;font-family:"Oswald",sans-serif;font-weight:700;color:#D0231D;text-transform:uppercase;line-height:1.07;letter-spacing:-.015em;transform-origin:50% 50%}
.title .ln{display:block;transform:scaleY(1.24);transform-origin:50% 50%;white-space:nowrap}
.title .ch{display:inline-block}
.kick{position:absolute;text-align:center;font:600 40px/1.15 "Inter",sans-serif;color:#FFFFFF;letter-spacing:.01em}
.script{position:absolute;font:700 76px/1 "Caveat",cursive;color:#1A1A1A;white-space:nowrap}
.imw{position:absolute}
.im{width:100%;height:100%;display:block}
.cut{filter:drop-shadow(0 26px 26px rgba(0,0,0,.35))}
.print{border:14px solid #F4F1EA;box-shadow:0 26px 44px rgba(0,0,0,.4);background:#F4F1EA}
.card{position:absolute;background:#E7D7B8;border-radius:22px;overflow:hidden;box-shadow:0 24px 44px rgba(0,0,0,.28);display:flex;flex-direction:column}
.cardimg{width:100%;object-fit:cover;display:block}
.cardcap{flex:1;display:flex;align-items:center;justify-content:center;text-align:center;padding:12px 18px;font:600 34px/1.1 "Inter",sans-serif;color:#1A1A1A;background:#FFFFFF}
.badge{position:absolute;z-index:5}
.icon{position:absolute;text-align:center}
.iconlab{font:700 26px/1.1 "Inter",sans-serif;color:inherit;margin-top:6px;white-space:nowrap}
.bub{position:absolute;padding:12px 26px 16px;border-radius:26px;font:800 50px/1 "Inter",sans-serif;color:#FFFFFF;white-space:nowrap;box-shadow:0 10px 20px rgba(0,0,0,.25)}
.tile{position:absolute;border-radius:12px;overflow:hidden;display:flex;align-items:center;justify-content:center}
.tileimg{width:82%;height:82%;object-fit:contain}
.count{position:absolute;text-align:center;font-family:"Oswald",sans-serif;font-weight:700;color:#D0231D;line-height:1;font-variant-numeric:tabular-nums;white-space:nowrap;transform:scaleY(1.2)}
.hline{position:absolute;height:5px;background:#1A1A1A;transform-origin:0 50%}
.arcs{position:absolute;inset:0;width:100%;height:100%;overflow:visible;pointer-events:none}
.arcs path{fill:none;stroke-width:6;stroke-linecap:round}
.box{position:absolute}
.cam,.fx{position:absolute;inset:0;transform-origin:50% 48%}
.imi{width:100%;height:100%;transform-origin:50% 60%}
.lot svg{width:100%!important;height:100%!important}
.sticker{filter:drop-shadow(6px 0 0 #fff) drop-shadow(-6px 0 0 #fff) drop-shadow(0 6px 0 #fff) drop-shadow(0 -6px 0 #fff) drop-shadow(0 22px 22px rgba(0,0,0,.4))}
.grain{position:absolute;inset:-200px;opacity:.16;mix-blend-mode:overlay;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='240' height='240'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' seed='3'/></filter><rect width='240' height='240' filter='url(%23n)' opacity='.9'/></svg>")}
.blueprint{position:absolute;inset:0;width:100%;height:100%;fill:none;stroke:rgba(255,255,255,.07);stroke-width:2}
.title.glow{text-shadow:0 0 30px rgba(208,35,29,.85),0 0 80px rgba(208,35,29,.5)}
.strike{position:absolute;left:-2%;right:-2%;top:46%;height:16px;background:#1A1A1A;transform-origin:0 50%;transform:rotate(-4deg)}
.marker{position:absolute;left:-10px;right:-10px;top:12%;bottom:6%;background:#FFE14D;z-index:-1;transform-origin:0 50%;border-radius:6px}
.kick,.script{z-index:3}
.spark{position:absolute;z-index:6;opacity:0}
.dig{display:inline-block;height:1em;overflow:hidden;vertical-align:top}
.digcol{display:flex;flex-direction:column}
.digit{display:block;height:1em;line-height:1em}
.cch{display:inline-block;line-height:1em;vertical-align:top}
.orbit{position:absolute}
.orbitline{position:absolute;inset:0;border:4px dashed rgba(255,255,255,.35);border-radius:50%}
.orbiticon{position:absolute;width:120px;height:120px}
.stamp{position:absolute;color:#D0231D;border:10px solid #D0231D;border-radius:14px;padding:4px 26px 0;font:700 120px/1.05 "Oswald",sans-serif;text-transform:uppercase;mix-blend-mode:multiply;opacity:.92;white-space:nowrap}
.shards{position:absolute;pointer-events:none}
.shard{position:absolute!important}
.paperwrap{position:absolute;perspective:1600px}
.strip{position:absolute;overflow:hidden;backface-visibility:hidden}
.sheet{position:absolute;background:#F4EFE3;box-shadow:inset 0 0 60px rgba(120,90,40,.18)}
.sheetpaper{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.35;mix-blend-mode:multiply;filter:grayscale(1)}
.foldshade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.45),rgba(0,0,0,0) 70%)}
.scrollwrap{position:absolute}
.scrollbody{position:absolute;inset:0;background:#EFE2C2;box-shadow:0 24px 50px rgba(0,0,0,.35);overflow:hidden}
.rod{position:absolute;background:linear-gradient(180deg,#5A2A12,#9B5A2E 45%,#4A200C);border-radius:20px;box-shadow:0 8px 14px rgba(0,0,0,.4)}
.grp{position:absolute;overflow:hidden}
.flash{position:absolute;inset:0;background:#FFFFFF;opacity:0;z-index:50;pointer-events:none}
.vs{display:flex;align-items:center;justify-content:center;border-radius:50%;background:#FFE14D;color:#1A1A1A;font:700 120px/1 "Oswald",sans-serif;box-shadow:0 0 0 12px #1A1A1A,0 20px 40px rgba(0,0,0,.5)}
.qcard{display:flex;align-items:center;justify-content:center;font:600 76px/1 "Inter",sans-serif;color:#1A1A1A;box-shadow:0 26px 50px rgba(0,0,0,.35)}
.glowblue{box-shadow:0 0 0 6px #7FC8FF,0 0 70px rgba(80,170,255,.8)!important}
.crack{background:#FFFFFF;box-shadow:0 0 24px rgba(255,255,255,.9)}

.bar{position:absolute;transform-origin:0 50%;border-radius:6px}
.barlab{position:absolute;font:800 34px/1 "Inter",sans-serif;color:#1A1A1A;letter-spacing:.04em;text-transform:uppercase;white-space:nowrap}
.barval{position:absolute;font:700 90px/1 "Oswald",sans-serif;color:#FFFFFF;white-space:nowrap}
</style>
</head>
<body>
<div id="root" data-composition-id="{{COMP_ID}}" data-width="1080" data-height="1920" data-start="0" data-duration="{{DURATION}}">
{{AUDIO}}
</div>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/bodymovin/5.12.2/lottie.min.js"></script>
<script>
const COMP_ID = "{{COMP_ID}}";
const DURATION = {{DURATION}};
{{DATA}}
</script>
<script>
{{ENGINE}}
</script>
</body>
</html>
