slug: floor-plan-to-interior-collage
model: nano-banana-pro
provider: gemini
use_case: 2D floor plan → 3D interior-design presentation board (multi-room collage)
form_factor: collage board
is_template: false
inputs:
  - kind: text_prompt
    role: scene description
    required: true
  - kind: image
    role: reference
    required: true
    notes: 2D floor plan as the structural reference.
source:
  url: https://dev.to/googleai/nano-banana-pro-prompting-guide-strategies-1h9n
  author: DEV.to — Google AI team prompting guide
  retrieved: 2026-05-21
notes: |
  Layout-spec pattern using markdown labels (**Layout:**, **Style:**, **Quality:**).
  Explicitly defines a collage with one hero shot + 3 sub-shots and locks a
  shared style ("warm oak wood flooring and off-white walls across ALL images").
prompt: |
  Based on the uploaded 2D floor plan, generate a professional interior design presentation board in a single image. **Layout:** A collage with one large main image at the top (wide-angle perspective of the living area), and three smaller images below (Master Bedroom, Home Office, and a 3D top-down floor plan). **Style:** Apply a Modern Minimalist style with warm oak wood flooring and off-white walls across ALL images. **Quality:** Photorealistic rendering, soft natural lighting.
