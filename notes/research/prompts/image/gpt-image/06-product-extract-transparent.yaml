slug: product-extract-transparent
model: gpt-image-1.5
provider: openai
use_case: Extract product from a source image with transparent RGBA PNG output (cutout asset for design composition)
form_factor: 1024x1536 portrait
is_template: false
inputs:
  - kind: text_prompt
    role: edit instruction
    required: true
  - kind: image
    role: edit_base
    required: true
  - kind: flag
    name: size
    values: 1024x1536
    required: false
  - kind: flag
    name: background
    values: transparent
    required: true
  - kind: flag
    name: quality
    values: medium
    required: false
source:
  url: https://developers.openai.com/cookbook/examples/multimodal/image-gen-1.5-prompting_guide
  author: OpenAI Cookbook — GPT Image 1.5 Prompting Guide
  retrieved: 2026-05-21
notes: |
  Section 5.4 (transparent variant). Source spells out RGBA PNG, alpha contact
  shadow, and "no hard cut line" — these are the failure modes the model needs
  steered away from. Pair with background="transparent" parameter; if you omit
  the parameter the model will still render a halo despite the prompt.
prompt: |
  Extract the product from the input image. Output: transparent background (RGBA PNG), crisp silhouette, no halos/fringing. Preserve product geometry and label legibility exactly. Optional: subtle, realistic contact shadow in the alpha (no hard cut line). Do not restyle the product; only remove background and lightly polish.
