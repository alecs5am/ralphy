slug: logo-vector-bakery
model: gpt-image-1.5
provider: openai
use_case: Original vector-style brand logo with negative-space discipline and plain background
form_factor: 1024x1536
is_template: true
inputs:
  - kind: text_prompt
    role: scene description
    required: true
  - kind: flag
    name: size
    values: 1024x1536
    required: false
  - kind: flag
    name: quality
    values: medium
    required: false
  - kind: flag
    name: n
    values: "4"
