slug: digital-illustration-hand-drawn-monster
model: recraft-v3
provider: recraft
use_case: Hand-drawn cartoon monster (API examples reference prompt)
form_factor: 1024x1024
is_template: false
inputs:
  - kind: text_prompt
    role: subject description
    required: true
  - kind: flag
    name: style
    values: realistic_image | digital_illustration | vector_illustration | icon | logo_raster | any
    required: true
    selected: digital_illustration
  - kind: flag
    name: substyle
    required: false
    selected: hand_drawn
  - kind: flag
    name: size
    values: 1024x1024 | 1024x1365 | 1365x1024 | 1024x1707 | 1707x1024
    required: false
    selected: 1024x1024
  - kind: flag
    name: colors
    required: false
  - kind: image
    role: style_reference
    required: false
source:
  url: https://www.recraft.ai/docs/api-reference/examples.md
  author: Recraft API reference (Examples)
  retrieved: 2026-05-21
notes: |
  This is the official "Digital Illustration (V3)" example in the API docs
  with explicit style note "Style: Hand-drawn". Useful as a smallest-valid
  payload for testing the `digital_illustration` + `substyle: hand_drawn`
  pairing.
prompt: |
  a monster with lots of hands
