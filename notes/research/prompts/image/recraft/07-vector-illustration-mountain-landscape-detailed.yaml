slug: vector-illustration-mountain-landscape-detailed
model: recraft-v3
provider: recraft
use_case: Detailed flat vector poster of a landscape
form_factor: 1024x1707 vector poster 9:16
is_template: false
inputs:
  - kind: text_prompt
    role: subject description
    required: true
  - kind: flag
    name: style
    values: realistic_image | digital_illustration | vector_illustration | icon | logo_raster | any
    required: true
    selected: vector_illustration
  - kind: flag
    name: substyle
    required: false
  - kind: flag
    name: size
    values: 1024x1024 | 1024x1365 | 1365x1024 | 1024x1707 | 1707x1024
    required: false
    selected: 1024x1707
  - kind: flag
    name: colors
    required: false
  - kind: image
    role: style_reference
    required: false
source:
  url: https://www.recraft.ai/docs/prompt-engineering-guide/visual-formats/vector-art.md
  author: Recraft (Vector Art guide)
  retrieved: 2026-05-21
notes: |
  Recraft publishes 3 variants of this prompt (minimal / descriptive /
  detailed) to illustrate prompt-density ladder for vector. This is the
  "detailed" one. Style enum is `vector_illustration` per source. Output
  vectorises cleanly to SVG via Recraft's vectorizer.
prompt: |
  Detailed flat vector illustration of mountain landscape, layered geometric mountains, stylized forest elements, gradient sunset sky, clean vector paths, contemporary poster design, rich color palette with complementary tones
