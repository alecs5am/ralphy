slug: icon-greek-sculpture-negative-space
model: recraft-v3
provider: recraft
use_case: Conceptual logo / icon using negative space
form_factor: 1024x1024 logo
is_template: false
inputs:
  - kind: text_prompt
    role: subject description
    required: true
  - kind: flag
    name: style
    values: realistic_image | digital_illustration | vector_illustration | icon | logo_raster | any
    required: true
    selected: icon
  - kind: flag
    name: substyle
    required: false
  - kind: flag
    name: size
    values: 1024x1024 | 1024x1365 | 1365x1024 | 1024x1707 | 1707x1024
    required: false
    selected: 1024x1024
  - kind: flag
    name: colors
    required: false
  - kind: image
    role: style_reference
    required: false
source:
  url: https://www.recraft.ai/docs/recraft-studio/image-generation/how-to-generate-a-logo.md
  author: Recraft Studio (How-to: Generate a Logo)
  retrieved: 2026-05-21
notes: |
  Shortest verbatim prompt the Recraft docs publish. Useful as a quick
  smoke-test for the "clever negative space" pattern. Source page also lists
  Geometric Logo / Sharp Drawn Logo / Playful Typographic as style hint
  variants — try those words verbatim as substyle hints when iterating.
prompt: |
  logo ancient Greek sculpture, clever negative space
