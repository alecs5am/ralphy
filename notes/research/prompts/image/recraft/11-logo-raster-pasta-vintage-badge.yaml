slug: logo-raster-pasta-vintage-badge
model: recraft-v3
provider: recraft
use_case: Vintage badge / emblem logo with seal aesthetic
form_factor: 1024x1024 logo
is_template: false
inputs:
  - kind: text_prompt
    role: subject description
    required: true
  - kind: flag
    name: style
    values: realistic_image | digital_illustration | vector_illustration | icon | logo_raster | any
    required: true
    selected: logo_raster
  - kind: flag
    name: substyle
    required: false
    selected: null
  - kind: flag
    name: size
    values: 1024x1024 | 1024x1365 | 1365x1024 | 1024x1707 | 1707x1024
    required: false
    selected: 1024x1024
  - kind: flag
    name: colors
    required: false
  - kind: image
    role: style_reference
    required: false
source:
  url: https://www.recraft.ai/docs/prompt-engineering-guide/visual-formats/logos-and-icons.md
  author: Recraft (Logos & Icons guide)
  retrieved: 2026-05-21
notes: |
  Recraft labels this "Vintage badge: texture, retro style, detailed shapes".
  Pairs naturally with `logo_raster` (texture + warm-tone palette). Use
  `vector_illustration` only if you need a flatter, scalable version.
prompt: |
  Vintage badge logo for artisan pasta brand, circular emblem with wheat sheaf and pasta shapes in center, ornate decorative border, ribbon banner with 'Est. 1892', classic Italian typography, warm gold and cream palette, traditional family recipe seal design
