slug: icon-pasta-line-monoline
model: recraft-v3
provider: recraft
use_case: Line / monoline icon for app or culinary brand
form_factor: 1024x1024 square icon
is_template: false
inputs:
  - kind: text_prompt
    role: subject description
    required: true
  - kind: flag
    name: style
    values: realistic_image | digital_illustration | vector_illustration | icon | logo_raster | any
    required: true
    selected: icon
  - kind: flag
    name: substyle
    required: false
    selected: null
  - kind: flag
    name: size
    values: 1024x1024 | 1024x1365 | 1365x1024 | 1024x1707 | 1707x1024
    required: false
    selected: 1024x1024
  - kind: flag
    name: colors
    required: false
  - kind: image
    role: style_reference
    required: false
source:
  url: https://www.recraft.ai/docs/prompt-engineering-guide/visual-formats/logos-and-icons.md
  author: Recraft (Logos & Icons guide)
  retrieved: 2026-05-21
notes: |
  Recraft labels this "Line icon: contour symbols, simple geometry". Best
  pair is `style: icon` for the dedicated icon-style enum; `vector_illustration`
  also works if you specifically need SVG output. Reinforce "consistent stroke
  width" and "monoline" in the prompt to keep Recraft on rails.
prompt: |
  Line art icon logo for pasta brand, simple outline of spaghetti wrapped around fork, consistent stroke width, monoline style, clean and minimal, works at small sizes, modern culinary app aesthetic
