notes: |
  POV-hands-first opening lowers the human-i2v risk — Seedance handles hands well; the face only
  enters at 5-9s. Still safer to route human reveal through Kling if drift appears. Spoken English
  ("You did not") → Kling --audio if migrating. Source omits music direction — explicitly ban music
  in the prompt for Kling. Strong gifting-emotion finale needs the start↔end-frame motion delta
  rule: ensure the surprise beat reads as a distinct facial change vs the wrapping shot.
prompt: |
  First-person POV shot. Hands unwrapping a matte black box on a white table. 0 to 4s: Slow pull back on packaging, fingers carefully lifting the lid. No face. Ambient sound of tissue paper and box opening. 5 to 9s: Product is revealed, camera tilts up from the product to a woman's face across the table. She covers her mouth in surprise. 10 to 14s: She picks it up, looks at camera and says "You did not." Soft laugh. 15s: Product stays in frame, name card visible beside it. Warm afternoon light, 9:16 vertical, emotional gifting atmosphere.
