notes: |
  Source explicitly bans music ("Authentic vibe, 9:16, no music, street ambient audio") — matches
  Ralphy Kling discipline cleanly. Single male actor, outdoor handheld — human-anchored, so any
  i2v variant must route through kwaivgi/kling-v3.0-pro. English dialogue lines → Kling --audio.
  Note "Street interview" here is single-person; for multi-actor see VideoAI's street interview prompt.
prompt: |
  Outdoor street setting, busy sidewalk slightly blurred in background. A 22-year-old man stops mid-walk, turns to camera. Hoodie, earbuds around his neck. 0 to 3s: "Someone just told me about this and I had to try it." He pulls the product out of his jacket pocket. Handheld shaky cam, natural city sounds. 4 to 9s: He holds it up, turns it over once. "Okay it is actually exactly what they said." Close-up on his face. 10 to 15s: He looks back at camera, laughing slightly, says "Yeah I am sold" and walks off frame. Authentic vibe, 9:16, no music, street ambient audio.
