notes: |
  Source pairs prompt with Seedance 2.0. Human-anchored selfie with synced dialogue — Seedance privacy
  filter can reject photoreal human i2v anchors, so if running i2v swap to kwaivgi/kling-v3.0-pro
  (Kling --audio is canonical for English VO). English dialogue → Kling --audio is fine; Russian / non-EN
  → strip dialogue and post-mix VO via ElevenLabs. Music is not specified — ban it in the prompt if
  routing through Kling to avoid stock-music drift.
prompt: |
  A 26-year-old South Asian woman sits casually on her bathroom counter in the morning, no makeup, just woken up. She holds a small amber glass serum bottle up to the camera, squinting slightly like she is genuinely thinking. 0 to 3s: She says directly to camera, "Okay I need to talk about this." Handheld camera, natural bathroom lighting, slightly overexposed. 4 to 9s: She presses two fingers to her cheek and shows the bottle label close up. 10 to 15s: She looks back at camera, grins, says "You will thank me later" and the camera slowly pulls back. Warm tone, documentary feel, 9:16 vertical, ambient morning sound.
