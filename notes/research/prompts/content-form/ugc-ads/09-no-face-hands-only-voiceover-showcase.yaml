prompt: |
  No face, hands only throughout. A pair of clean hands with neutral nail polish on a white marble surface. 0 to 4s: Hands open a minimal product box. Slow and deliberate. Overhead shot, soft studio light. 4 to 9s: Hands lift the product, rotate it 360 degrees. Camera pushes in on the product details from above. 10 to 13s: Hands apply or use the product naturally. Close-up on the moment of use. 14 to 15s: Hands set the product down, step back out of frame. Product stays centered in frame. Camera holds. Calm, confident female voiceover at the 14-second mark, single line only. No music under the voiceover. 9:16 vertical, premium product feel.
