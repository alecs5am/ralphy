notes: |
  Premium register, single human, fixed camera — drift-prone if i2v anchor isn't locked. Use a
  master-shot ref for the founder identity across cuts (super-original refs memory) and pass via
  --ref on every regen. Photoreal still register memory applies: Sony A7 IV + Sigma 35/85mm
  improves believability. Kling for human i2v; English dialogue → Kling --audio.
prompt: |
  A 35-year-old woman at a clean kitchen table, minimal branding visible in background. She looks directly into camera with a calm, knowledgeable expression and no script energy. 0 to 4s: "We built this because I could not find anything that actually worked for me." She sets a product bottle on the table. Soft overhead lighting, fixed stable camera. 5 to 10s: She slides it closer to camera and explains one thing about it. 11 to 15s: She looks up from the product to camera and says "That is why I made this." Long beat. Holds eye contact. Warm, premium feel, 9:16 vertical.
