prompt: |
  A 24-year-old Black woman sits cross-legged on a bed surrounded by tissue paper, mid-unboxing. Oversized vintage tee, natural hair. 0 to 3s: She pulls out a sleek product box and her eyes go wide with genuine surprise, she mouths the word "wait." Handheld shaky cam, ring light warmth. 4 to 8s: She holds the product up, turning it slowly. Camera follows her hands in a close medium shot. 9 to 13s: She puts it down, looks straight at camera and says "I was not expecting this" with a small laugh. 14 to 15s: Quick cut to product alone on white bedsheet. 9:16 vertical, bright casual room lighting, relatable energy.
