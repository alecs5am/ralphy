notes: |
  Split-comparison narrative. Competitor framing — verify legal before naming.
prompt: |
  Frame divided vertically or horizontally. Left/top: competitor product or old workflow — cluttered, confusing, many clicks. Flat lighting, slightly desaturated. Right/bottom: your product — clean, minimal, one-click solution. Premium lighting, full color. Both sides animate simultaneously. Left side shows complex multi-step process. Right side shows single elegant interaction achieving same result. Timer on each side counts the steps/seconds. At resolution: left side still processing. Right side: done. Checkmark animation. Confetti or subtle celebration effect. Sound: left side has frustrated, cluttered audio (notifications, errors). Right side has clean, satisfying clicks and completion sounds.
