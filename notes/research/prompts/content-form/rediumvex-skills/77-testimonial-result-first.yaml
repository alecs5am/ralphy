notes: |
  Result-first testimonial opener. Number sample is 0-347% — swap for real metric.
prompt: |
  Single bold statistic center-frame. Large white typography on dark background. Number counts up rapidly — 0 to 347% — in 1.2 seconds. Each digit change accompanied by soft click sound. Camera slight push-in during count. At 1.5s: number resolves. Holds for 0.3s. Then: cut to or dissolve into customer's face — warmly lit, looking slightly off-camera, beginning to speak. Viewer is already primed: this person got that result.
