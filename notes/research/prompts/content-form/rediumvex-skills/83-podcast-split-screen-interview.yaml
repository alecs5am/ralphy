  Split-screen interview reconstruction podcast template.
prompt: |
  Seedance 2.0 video prompt, {{ASPECT_RATIO}}, {{DURATION}} seconds:

  Opening: split-screen, {{PANEL_RATIO}} division.

  Left panel: {{ENVIRONMENT_LEFT}}, {{SUBJECT_DESCRIPTION_LEFT}}, {{LIGHTING_LEFT}}.

  Right panel: {{ENVIRONMENT_RIGHT}}, {{SUBJECT_DESCRIPTION_RIGHT}}, {{LIGHTING_RIGHT}}.

  At second {{X}}: panels {{SHIFT_BEHAVIOR}}. {{CAMERA_MOVEMENT_LEFT}}. {{CAMERA_MOVEMENT_RIGHT}}.

  At second {{Y}}: {{QUOTE_TEXT}} appears as lower-third on {{PANEL}}, {{FONT_SPEC}}: "{{EXACT_QUOTE}}." Text persists {{TIME}}.

  Final {{TIME}} seconds: {{END_FRAME_DESCRIPTION}}.

  Color grade: {{COLOR_GRADE_DIRECTION}}.
