prompt: |
  Seedance 2.0 video prompt, {{ASPECT_RATIO}}, {{DURATION}} seconds:

  Opening frame: {{PRIMARY_COLOR_PALETTE}} void, {{LIGHT_SOURCE_DESCRIPTION}}. Camera is {{CAMERA_BEHAVIOR}}. Hold {{TIME}} seconds.

  At second {{X}}: {{MOTION_BEHAVIOR_DESCRIPTION}} over {{DURATION}} seconds. {{PARTICLE_OR_TEXTURE_BEHAVIOR}}.

  Final {{TIME}} seconds: {{RESOLUTION_VISUAL}}. Speaker name appears {{POSITION}} in {{FONT_DESCRIPTION}}: "— {{SPEAKER_NAME}}." Below: "{{SHOW_NAME}} | Episode {{NUMBER}}." Fade to black.

  Color grade: {{COLOR_GRADE_DIRECTION}}.
