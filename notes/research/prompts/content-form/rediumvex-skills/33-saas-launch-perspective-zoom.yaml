notes: |
  Perspective-zoom into product UI. Strong demo opener.
prompt: |
  Start with wide shot: device on desk in stylish workspace. Warm ambient lighting, shallow depth of field. Camera begins pushing toward screen. At 2s: camera crosses the screen boundary — transition from physical space to digital space. The UI fills the entire frame. Camera continues moving forward, navigating through interface elements as if flying through the product. UI elements pass by camera at different depths — parallax effect. Sidebar slides past on left, cards float by on right. Navigation elements form a corridor. Camera moves through the product like walking through a building. Sound: real-world ambient fades out as camera enters screen. Digital ambient fades in — clean, processed, reverb-free. UI sounds become prominent. Music becomes more electronic/digital.
