notes: |
  Contrast-story testimonial opener. Compare to skill 07 (before-after) templates.
prompt: |
  Split-screen. Left side: grainy, slightly desaturated footage or image representing the 'before' state — the problem, the struggle, the mess. Right side: clean, warm, vibrant footage representing 'after.' Both sides hold for 1.5s. Then: left side collapses toward center, right side expands to fill full frame. Sound: before side has flat, muted audio. Transition whoosh. After side has rich, warm audio treatment. The visual argument is already made before a word is spoken.
