prompt: |
  Single continuous cinematic shot in Shibuya. A schoolgirl sprints at extreme speed, weaving along crosswalks and walls, vaulting a railing, sliding under a barrier. Camera stays low and close to the ground, tracking alongside her with motion-blurred neon storefronts streaking past. Rainy night reflections, anamorphic flare, hi-fi footstep audio. 35mm cinematic, no cuts.
