notes: |
  Vertical ASMR — explicit "no music" instruction. Sequential macro beats
  (tap → twist → scoop → spread). Text-to-video.
prompt: |
  Create a vertical ASMR video with no music, focusing on macro details. A light blue skincare gel bottle sits on glass with a pure white seamless background and dramatic top lighting. A finger taps the lid, then a hand twists open the cap, scoops a pearl of gel onto a fingertip, and spreads it slowly across the back of a hand. Crisp tap, twist click, soft scoop sound, gel squelch — natural ASMR-grade audio, no music.
