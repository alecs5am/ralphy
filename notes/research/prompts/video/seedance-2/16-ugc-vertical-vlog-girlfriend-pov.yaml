prompt: |
  Create a 15-second vertical (9:16) handheld vlog in natural golden-hour light, with film grain and slight camera shake.

  Shot 1: A girl runs up to the camera, slightly out of breath, smiles wide and waves — first-person girlfriend-POV intro vibe.

  Shot 2: She turns the camera around to share a slow pan over a river at golden hour, water glittering, her voice slightly off-mic.

  Shot 3: She holds an ice cream cone toward the lens, takes a bite, laughs. Camera drifts handheld, soft focus pulls.

  Warm, naturalistic color grade. No on-screen text. UGC vlog aesthetic.
