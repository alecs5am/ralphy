prompt: |
  A nature documentary scene showing an otter piloting a small airplane. The otter wears aviator goggles and a tiny scarf, paws on the controls, looking focused yet playful. Low-angle tracking shot from inside the cockpit, then cut to exterior side-view as the plane banks over a sun-lit coastline. Naturalistic documentary lighting, gentle handheld feel, no on-screen text.
