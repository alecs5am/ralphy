prompt: |
  First-person POV handheld footage with slight natural shake. The only light comes from a headlamp cutting a narrow beam through pitch-black cave darkness. Wet limestone walls glisten. The beam pans left to right, catches stalactites overhead, then drops to reveal an opening narrowing into a tight passage. Breath audible. Subtle drip echo. 35mm cinematic, deep blacks, ISO grain.
