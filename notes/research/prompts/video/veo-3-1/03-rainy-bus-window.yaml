slug: rainy-bus-window
model: veo-3.1
provider: gemini
use_case: cinematic close-up — shallow depth of field, melancholic mood
form_factor: horizontal 16:9 / 8s cinematic
is_template: false
inputs:
  - kind: text_prompt
    role: scene description (cinematic, dialogue-rich)
    required: true
  - kind: image
    role: reference
    required: false
    notes: Veo 3.1 supports multi-image references for character / style consistency
  - kind: flag
    name: aspect_ratio
    values: 16:9 | 9:16
    required: false
  - kind: flag
    name: duration
    values: 8s
    required: false
  - kind: flag
    name: audio_enabled
    role: Veo 3.1 has native audio (dialogue + SFX + music)
    required: false
    selected: false
source:
  url: https://cloud.google.com/blog/products/ai-machine-learning/ultimate-prompting-guide-for-veo-3-1
  author: Google Cloud
  retrieved: 2026-05-21
notes: |
  Repeated verbatim in both Google's official guide and SeaArt's Top-22 list — considered a Veo 3.1 reference prompt.
  Shallow DoF + reflection layering is the technique being demonstrated.
prompt: |
  Close-up with very shallow depth of field, a young woman's face, looking out a bus window at the passing city lights with her reflection faintly visible on the glass, inside a bus at night during a rainstorm, melancholic mood with cool blue tones, moody, cinematic.
