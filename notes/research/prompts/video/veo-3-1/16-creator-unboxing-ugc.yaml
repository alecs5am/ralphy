slug: creator-unboxing-ugc
model: veo-3.1
provider: gemini
use_case: UGC creator unboxing — direct-to-camera native dialogue
form_factor: vertical 9:16 / 8s short-form
is_template: false
inputs:
  - kind: text_prompt
    role: scene description (cinematic, dialogue-rich)
    required: true
  - kind: image
    role: reference
    required: false
    notes: Optionally pass a product image + creator face ref for identity lock across a series.
  - kind: flag
    name: aspect_ratio
    values: 16:9 | 9:16
    required: false
  - kind: flag
    name: duration
    values: 8s
    required: false
  - kind: flag
    name: audio_enabled
    role: Veo 3.1 has native audio (dialogue + SFX + music)
    required: false
    selected: true
source:
  url: https://www.seaart.ai/blog/veo-3-1-prompts
  author: SeaArt (community Top-22)
  retrieved: 2026-05-21
notes: |
  Mainstream short-form UGC pattern — box opening foley layered with a single exclamation line. Keep the spoken line ≤ 8s of speech; Veo 3.1 will pace it across the clip.
prompt: |
  Medium shot of content creator at desk opening product box with excited expression. Camera positioned at slight high angle. She pulls out product and holds it up to camera. Bright natural window lighting, YouTube aesthetic. Audio: Box opening sounds, enthusiastic voice: "Oh wow, look at this!"
