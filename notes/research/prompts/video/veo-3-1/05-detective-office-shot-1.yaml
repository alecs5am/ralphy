slug: detective-office-shot-1
model: veo-3.1
provider: gemini
use_case: dialogue scene — multi-shot using "Ingredients to Video" (3 ref images)
form_factor: horizontal 16:9 / 8s cinematic
is_template: false
inputs:
  - kind: text_prompt
    role: scene description (cinematic, dialogue-rich)
    required: true
  - kind: image
    role: reference
    required: true
    notes: Veo 3.1 "Ingredients to Video" workflow — supply 3 references (detective character, woman character, office setting). The model composites them into the shot.
  - kind: flag
    name: aspect_ratio
    values: 16:9 | 9:16
    required: false
  - kind: flag
    name: duration
    values: 8s
    required: false
  - kind: flag
    name: audio_enabled
    role: Veo 3.1 has native audio (dialogue + SFX + music)
    required: false
    selected: true
source:
  url: https://cloud.google.com/blog/products/ai-machine-learning/ultimate-prompting-guide-for-veo-3-1
  author: Google Cloud
  retrieved: 2026-05-21
notes: |
  Shot 1 of a 2-shot detective dialogue pair (see 06-detective-office-shot-2.yaml for the reverse). Voice direction ("weary voice") gets honored. Same 3 refs are reused in shot 2 for character consistency across cuts.
prompt: |
  Using the provided images for the detective, the woman, and the office setting, create a medium shot of the detective behind his desk. He looks up at the woman and says in a weary voice, "Of all the offices in this town, you had to walk into mine."
