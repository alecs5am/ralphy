</style>

</template>
<script data-catalog-js>
  function catalog_cam_crash_zoom(tl, o) {
    var T = o.at, d = o.duration;
    tl.set(o.target, { transformOrigin: o.focusX + "px " + o.focusY + "px" }, T);
    tl.fromTo(o.target, { scale: 1 }, { scale: o.scale * 1.06, duration: d * 0.6, ease: "expo.in", immediateRender: false }, T);

  }
</script>
