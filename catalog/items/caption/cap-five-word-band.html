<!-- catalog item: cap-five-word-band (caption). Contract: function catalog_cap_five_word_band(tl, o)
     Dark text on a white band that slides up; the spoken word turns red. o.words = [{ text, start, end }] in composition seconds (scribe word timings, AGENTS.md #16); chunks break at 5 words, a pause over 0.3 s, or clause punctuation. Params: y, size, text, highlight, background. -->
<style data-catalog-css>

<script data-catalog-js>
  function catalog_cap_five_word_band(tl, o) {
    var N = 5, MIN = 0.6, CPL = 28;
    var wrap = document.getElementById("cfwb-wrap");
    wrap.style.top = o.y + "px";
    var words = o.words || [], chunks = [], cur = [];
    for (var i = 0; i < words.length; i++) {
      var prev = words[i - 1];

      if (cur.length && (cur.length >= N || (prev && (words[i].start - prev.end > 0.3 || /[.!?,;:]$/.test(prev.text))))) { chunks.push(cur); cur = []; }
      cur.push(words[i]);
    }
    if (cur.length) chunks.push(cur);
    for (var c = 0; c < chunks.length; c++) {
      var ch = chunks[c], el = document.createElement("div"), line = document.createElement("span"), spans = [];
      el.className = "cfwb-chunk"; el.id = "cfwb-c" + c; line.className = "cfwb-line";
      // Shrink for a word longer than the line holds (Russian words run long): no measuring, so no font-load race.
      var longest = 1;
      for (var q = 0; q < ch.length; q++) longest = Math.max(longest, ch[q].text.length);

      el.style.color = o.text;
      line.style.backgroundColor = o.background;
      for (var j = 0; j < ch.length; j++) {
        var s = document.createElement("span");
        s.className = "cfwb-w"; s.textContent = ch[j].text;

      tl.set(el, { visibility: "hidden", opacity: 0 }, end);
      tl.fromTo(el, { y: 46 }, { y: 0, duration: 0.22, ease: "power3.out", immediateRender: false }, start);

        var w = ch[k], sp = spans[k], until = k + 1 < ch.length ? ch[k + 1].start : end;

      }
    }
  }
</script>
