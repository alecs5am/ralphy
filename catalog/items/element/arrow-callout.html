<!-- catalog item: arrow-callout (element). Contract: function catalog_arrow_callout(tl, o)
     A target ring pulses, a hand-drawn arrow draws toward it, the label pops at the tail. Params: label, targetX, targetY, color. -->
<style data-catalog-css>
  .ac-svg { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; overflow: visible; }
  .ac-ring { position: absolute; width: 220px; height: 220px; margin: -110px 0 0 -110px; border-radius: 50%; border: 10px solid; }
  .ac-label { position: absolute; font-family: "Inter", sans-serif; font-weight: 800; font-size: 56px; padding: 14px 26px; border-radius: 18px; color: #141414; white-space: nowrap; }
</style>
<template data-catalog-markup>
  <div class="ac-ring" id="ac-ring"></div>
  <svg class="ac-svg" viewBox="0 0 1080 1920"><path id="ac-path" fill="none" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" /><path id="ac-head" fill="none" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" /></svg>
  <div class="ac-label" id="ac-label"></div>
</template>
<script data-catalog-js>
  function catalog_arrow_callout(tl, o) {
    var T = o.at, tx = o.targetX, ty = o.targetY, sx = 200, sy = ty + 520;
    var cx = sx + 40, cy = ty + 120;
    var ex = tx - 120 * Math.sign(tx - sx || 1), ey = ty + 90;
    var path = document.getElementById("ac-path"), head = document.getElementById("ac-head");
    path.setAttribute("d", "M" + sx + " " + sy + " Q" + cx + " " + cy + " " + ex + " " + ey);
    var ang = Math.atan2(ey - cy, ex - cx), L = 46;
    head.setAttribute("d", "M" + (ex - L * Math.cos(ang - 0.5)) + " " + (ey - L * Math.sin(ang - 0.5)) + " L" + ex + " " + ey + " L" + (ex - L * Math.cos(ang + 0.5)) + " " + (ey - L * Math.sin(ang + 0.5)));
    [path, head].forEach(function (p) { p.setAttribute("stroke", o.color); });
    var ring = document.getElementById("ac-ring"); ring.style.left = tx + "px"; ring.style.top = ty + "px"; ring.style.borderColor = o.color;
    var label = document.getElementById("ac-label"); label.textContent = o.label; label.style.backgroundColor = o.color;
    label.style.left = (sx - 120) + "px"; label.style.top = (sy + 10) + "px";
    var len = path.getTotalLength();
    tl.from("#ac-ring", { scale: 0, duration: 0.35, ease: "back.out(2.2)" }, T);
    tl.to("#ac-ring", { scale: 1.12, duration: 0.25, ease: "sine.inOut", yoyo: true, repeat: 3 }, T + 0.35);
    tl.fromTo(path, { strokeDasharray: len, strokeDashoffset: len }, { strokeDashoffset: 0, duration: 0.5, ease: "power2.inOut" }, T + 0.15);
    tl.from(path, { opacity: 0, duration: 0.01, ease: "none" }, T + 0.15);
    tl.from(head, { opacity: 0, duration: 0.1, ease: "none" }, T + 0.6);
    tl.from("#ac-label", { scale: 0, opacity: 0, transformOrigin: "20% 0%", duration: 0.4, ease: "back.out(2.4)" }, T + 0.1);
  }
</script>
