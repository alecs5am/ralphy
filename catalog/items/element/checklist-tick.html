<!-- catalog item: checklist-tick (element). Contract: function catalog_checklist_tick(tl, o)
     Rows land, then each box draws its check in turn and the row dims to done. Params: items (pipe-separated), color, y. -->
<style data-catalog-css>
  .ct-wrap { position: absolute; left: 90px; right: 140px; display: flex; flex-direction: column; gap: 34px; }
  .ct-row { display: flex; align-items: center; gap: 30px; font-family: "Inter", sans-serif; font-weight: 700; font-size: 56px; color: #f6f3ec; }
  .ct-box { flex: 0 0 auto; width: 84px; height: 84px; border-radius: 18px; border: 6px solid rgba(246,243,236,0.85); position: relative; }
  .ct-box svg { position: absolute; left: 6px; top: 6px; width: 60px; height: 60px; overflow: visible; }
</style>
<template data-catalog-markup>
  <div class="ct-wrap" id="ct-wrap"></div>
</template>
<script data-catalog-js>
  function catalog_checklist_tick(tl, o) {
    var T = o.at, wrap = document.getElementById("ct-wrap"), rows = String(o.items).split("|").map(function (x) { return x.trim(); }).filter(Boolean);
    wrap.style.top = o.y + "px";
    rows.forEach(function (txt, i) {
      var row = document.createElement("div"); row.className = "ct-row";
      var box = document.createElement("div"); box.className = "ct-box";
      box.innerHTML = '<svg viewBox="0 0 60 60"><path d="M8 32 L24 47 L53 12" fill="none" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/></svg>';
      var path = box.querySelector("path"); path.setAttribute("stroke", o.color);
      var label = document.createElement("span"); label.textContent = txt;
      row.appendChild(box); row.appendChild(label); wrap.appendChild(row);
      tl.from(row, { x: -60, opacity: 0, duration: 0.4, ease: "power3.out" }, T + i * 0.12);
      var t = T + 0.5 + i * 0.35;
      tl.fromTo(path, { strokeDasharray: 70, strokeDashoffset: 70 }, { strokeDashoffset: 0, duration: 0.22, ease: "power2.out" }, t);
      tl.to(box, { borderColor: o.color, scale: 1.1, duration: 0.12, ease: "power2.out", yoyo: true, repeat: 1 }, t);
      tl.to(label, { opacity: 0.6, duration: 0.25, ease: "power1.out" }, t + 0.1);
    });
  }
</script>
