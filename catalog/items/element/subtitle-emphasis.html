<!-- catalog item: subtitle-emphasis (element). Contract: function catalog_subtitle_emphasis(tl, o)
     A caption line lands, then one word gets the hit: color swap, scale punch, box behind it. Params: words, emphasisIndex, color, y. -->
<style data-catalog-css>
  .se-line { position: absolute; left: 70px; right: 130px; text-align: center; font-family: "Inter", sans-serif; font-weight: 900; font-size: 84px; line-height: 1.2; color: #ffffff; text-transform: uppercase; }
  .se-w { display: inline-block; position: relative; margin: 0 10px; -webkit-text-stroke: 8px #111111; paint-order: stroke fill; }
  .se-box { position: absolute; left: -14px; right: -14px; top: 4px; bottom: 0; border-radius: 12px; z-index: -1; transform: scale(0); }
</style>
<template data-catalog-markup>
  <div class="se-line" id="se-line"></div>
</template>
<script data-catalog-js>
  function catalog_subtitle_emphasis(tl, o) {
    var T = o.at, line = document.getElementById("se-line"), words = String(o.words).split(/\s+/).filter(Boolean);
    var k = Math.min(words.length - 1, Math.max(0, Math.round(o.emphasisIndex)));
    line.style.top = o.y + "px";
    var hot = null, box = null;
    words.forEach(function (w, i) {
      var s = document.createElement("span"); s.className = "se-w"; s.textContent = w;
      if (i === k) { box = document.createElement("span"); box.className = "se-box"; box.style.backgroundColor = o.color; s.appendChild(box); hot = s; }
      line.appendChild(s);
    });
    tl.from(".se-w", { y: 30, opacity: 0, duration: 0.25, ease: "power2.out", stagger: 0.07 }, T);
    var hit = T + 0.25 + words.length * 0.07;
    tl.to(box, { scale: 1, duration: 0.22, ease: "back.out(2)" }, hit);
    tl.fromTo(hot, { scale: 1, color: "#ffffff" }, { scale: 1.28, color: "#111111", duration: 0.14, ease: "power3.out" }, hit);
    tl.to(hot, { scale: 1.12, duration: 0.3, ease: "elastic.out(1, 0.5)" }, hit + 0.14);
    tl.set(hot, { webkitTextStroke: "0px #111111" }, hit);
  }
</script>
