<!-- catalog item: notification-toast (element). Contract: function catalog_notification_toast(tl, o)
     Phone-style notification drops from the top with a spring, icon pops, body text settles. Params: app, title, body, accent, y. -->
<style data-catalog-css>
  .nt-card { position: absolute; left: 60px; width: 900px; display: flex; gap: 28px; align-items: flex-start; padding: 32px 36px; border-radius: 40px; background: rgba(246,243,236,0.94); box-shadow: 0 30px 80px rgba(0,0,0,0.35); }
  .nt-icon { flex: 0 0 auto; width: 104px; height: 104px; border-radius: 26px; display: grid; place-items: center; font-family: "Anton", "Impact", sans-serif; font-size: 58px; color: #ffffff; }
  .nt-meta { font-family: "Inter", sans-serif; font-weight: 600; font-size: 30px; color: #6b665d; text-transform: uppercase; letter-spacing: 2px; }
  .nt-title { font-family: "Inter", sans-serif; font-weight: 800; font-size: 46px; color: #141414; margin-top: 6px; }
  .nt-body { font-family: "Inter", sans-serif; font-weight: 500; font-size: 40px; color: #2b2925; margin-top: 4px; line-height: 1.25; }
</style>
<template data-catalog-markup>
  <div class="nt-card" id="nt-card"><div class="nt-icon" id="nt-icon"></div><div><div class="nt-meta" id="nt-meta"></div><div class="nt-title" id="nt-title"></div><div class="nt-body" id="nt-body"></div></div></div>
</template>
<script data-catalog-js>
  function catalog_notification_toast(tl, o) {
    var T = o.at;
    var card = document.getElementById("nt-card"); card.style.top = o.y + "px";
    var icon = document.getElementById("nt-icon"); icon.style.backgroundColor = o.accent; icon.textContent = String(o.app).charAt(0).toUpperCase();
    document.getElementById("nt-meta").textContent = o.app + "  now";
    document.getElementById("nt-title").textContent = o.title;
    document.getElementById("nt-body").textContent = o.body;
    tl.from("#nt-card", { y: -(o.y + 360), duration: 0.7, ease: "back.out(1.3)" }, T);
    tl.from("#nt-icon", { scale: 0, rotation: -30, duration: 0.4, ease: "back.out(2.5)" }, T + 0.35);
    tl.from(["#nt-title", "#nt-body"], { y: 20, opacity: 0, duration: 0.35, ease: "power2.out", stagger: 0.08 }, T + 0.4);
  }
</script>
