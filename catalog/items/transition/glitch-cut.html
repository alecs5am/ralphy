<!-- catalog item: glitch-cut (transition). Contract: function catalog_glitch_cut(tl, o)
     Stepped jitter, slice bars and hue/contrast hits, with a two-flicker swap. Seeded PRNG keeps it deterministic. Params: duration, amount, seed, barColorA, barColorB. -->
<style data-catalog-css>
  .gc-bar { position: absolute; left: -60px; width: 1200px; height: 60px; opacity: 0; }
</style>
<template data-catalog-markup>
  <div class="gc-bar" id="gc-bar-0"></div><div class="gc-bar" id="gc-bar-1"></div><div class="gc-bar" id="gc-bar-2"></div>
  <div class="gc-bar" id="gc-bar-3"></div><div class="gc-bar" id="gc-bar-4"></div><div class="gc-bar" id="gc-bar-5"></div>
</template>
<script data-catalog-js>
  function catalog_glitch_cut(tl, o) {
    var s = o.seed >>> 0;
    function rnd() { s = (s + 0x6d2b79f5) >>> 0; var t = s; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }
    var T = o.at, d = o.duration, steps = 8;
    for (var i = 0; i < steps; i++) {
      var t = T + (i * d) / steps;
      tl.set(o.stage, { x: (rnd() - 0.5) * o.amount, skewX: (rnd() - 0.5) * 8, filter: "hue-rotate(" + Math.round(rnd() * 120) + "deg) contrast(1.5)" }, t);
      for (var b = 0; b < 6; b++) {
        tl.set("#gc-bar-" + b, { y: Math.round(rnd() * 1860), height: 16 + Math.round(rnd() * 110), x: (rnd() - 0.5) * 240,
          backgroundColor: rnd() > 0.5 ? o.barColorA : o.barColorB, opacity: rnd() > 0.45 ? 0.4 : 0 }, t);
      }
    }
    // Flicker A/B twice, then commit to B (the eye reads the stutter as one cut).
    tl.set(o.to, { opacity: 1 }, T + d * 0.25);
    tl.set(o.to, { opacity: 0 }, T + d * 0.375);
    tl.set(o.to, { opacity: 1 }, T + d * 0.5);
    tl.set(o.from, { opacity: 0 }, T + d * 0.5);
    tl.set(o.stage, { x: 0, skewX: 0, filter: "none" }, T + d);
    tl.set(".gc-bar", { opacity: 0 }, T + d);
  }
</script>
