<!-- catalog item: spin-swap (transition). Contract: function catalog_spin_swap(tl, o)
     Outgoing spins away while scaling up under blur; incoming spins in from the opposite angle and settles. Params: duration, angle, blur. -->
<style data-catalog-css></style>
<template data-catalog-markup></template>
<script data-catalog-js>
  function catalog_spin_swap(tl, o) {
    var T = o.at, h = o.duration / 2;
    tl.fromTo(o.from, { rotation: 0, scale: 1, filter: "blur(0px)" },
      { rotation: o.angle, scale: 1.9, filter: "blur(" + o.blur + "px)", duration: h, ease: "power3.in" }, T);
    tl.set(o.from, { opacity: 0, rotation: 0, scale: 1, filter: "none" }, T + h);
    tl.set(o.to, { opacity: 1 }, T + h);
    tl.fromTo(o.to, { rotation: -o.angle, scale: 1.9, filter: "blur(" + o.blur + "px)" },
      { immediateRender: false, rotation: 0, scale: 1, filter: "blur(0px)", duration: h * 1.3, ease: "power3.out" }, T + h);
  }
</script>
