<!-- catalog item: block-dissolve (transition). Contract: function catalog_block_dissolve(tl, o)
     Large blocks in two palette colors pop in a seeded order to cover, then clear in a different order on the incoming. Params: duration, colorA, colorB, cols, seed. -->
<style data-catalog-css>
  .bd-cell { position: absolute; transform: scale(0); }
</style>
<template data-catalog-markup>
  <div id="bd-wrap"></div>
</template>
<script data-catalog-js>
  function catalog_block_dissolve(tl, o) {
    var s = o.seed >>> 0;
    function rnd() { s = (s + 0x6d2b79f5) >>> 0; var t = s; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }
    var T = o.at, d = o.duration, cols = Math.max(3, Math.round(o.cols)), size = Math.ceil(1080 / cols), rows = Math.ceil(1920 / size);
    var wrap = document.getElementById("bd-wrap"), cells = [];
    for (var r = 0; r < rows; r++) for (var c = 0; c < cols; c++) {
      var el = document.createElement("div");
      el.className = "bd-cell";
      el.style.left = c * size + "px"; el.style.top = r * size + "px";
      el.style.width = size + 1 + "px"; el.style.height = size + 1 + "px";
      el.style.backgroundColor = rnd() > 0.5 ? o.colorA : o.colorB;
      wrap.appendChild(el); cells.push({ el: el, a: rnd(), b: rnd() });
    }
    var half = d * 0.45, pop = half * 0.35;
    cells.forEach(function (x) {
      tl.to(x.el, { scale: 1, duration: pop, ease: "back.out(2)" }, T + x.a * (half - pop));
      tl.to(x.el, { scale: 0, duration: pop, ease: "power2.in" }, T + d * 0.55 + x.b * (half - pop));
    });
    tl.set(o.from, { opacity: 0 }, T + d * 0.5);
    tl.set(o.to, { opacity: 1 }, T + d * 0.5);
  }
</script>
