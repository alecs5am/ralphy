<!-- catalog item: layout-reaction (layout). Contract: function catalog_layout_reaction(tl, o)
     Reactor face cam full-bleed, the clip being reacted to floats as a card in the upper half, the reactor's face stays clear below it. Params: cardTilt, caption, accent, source. -->
<style data-catalog-css>
  .lrx-cam { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; overflow: hidden; background: linear-gradient(180deg, #3b3346 0%, #1c1822 100%); }
  .lrx-wall { position: absolute; inset: -60px; background: repeating-linear-gradient(90deg, rgba(255,255,255,0.04) 0px, rgba(255,255,255,0.04) 60px, rgba(255,255,255,0) 60px, rgba(255,255,255,0) 120px); }
  .lrx-body { position: absolute; left: 240px; top: 1290px; width: 600px; height: 700px; border-radius: 300px 300px 0 0; background: #5a6b3c; }
  .lrx-face { position: absolute; left: 380px; top: 900px; width: 320px; height: 400px; border-radius: 48% 48% 44% 44%; background: #d9a47f; }
  .lrx-card { position: absolute; left: 80px; top: 250px; width: 880px; height: 620px; border-radius: 28px; overflow: hidden; background: #0c0c0c; box-shadow: 0 30px 70px rgba(0,0,0,0.55); }
  .lrx-clip { position: absolute; left: 0; top: 0; width: 880px; height: 495px; background: radial-gradient(circle at 40% 45%, rgba(255,90,90,0.7), rgba(255,90,90,0) 45%), linear-gradient(135deg, #20304f 0%, #0d1424 100%); }
  .lrx-source { position: absolute; left: 32px; top: 520px; font-family: "Inter", sans-serif; font-weight: 600; font-size: 34px; color: #f2f2f2; }
  .lrx-caption { position: absolute; left: 80px; top: 1340px; width: 880px; text-align: center; font-family: "Montserrat", "Inter", sans-serif; font-weight: 900; font-size: 60px; line-height: 1.1; color: #ffffff; -webkit-text-stroke: 8px #000000; paint-order: stroke fill; }
</style>
<template data-catalog-markup>
  <div class="lrx-cam" data-slot="reactor"><div class="lrx-wall" id="lrx-wall"></div><div class="lrx-body"></div><div class="lrx-face" id="lrx-face" data-safe-zone="face"></div></div>
  <div class="lrx-card" id="lrx-card" data-slot="clip"><div class="lrx-clip" id="lrx-clip"></div><div class="lrx-source" id="lrx-source"></div></div>
  <div class="lrx-caption" id="lrx-caption" data-slot="caption" data-safe-zone="caption"></div>
</template>
<script data-catalog-js>
  function catalog_layout_reaction(tl, o) {
    var T = o.at;
    document.getElementById("lrx-source").textContent = o.source;
    var cap = document.getElementById("lrx-caption");
    cap.textContent = o.caption;
    cap.style.color = o.accent;
    tl.from("#lrx-card", { y: -120, rotation: 0, opacity: 0, duration: 0.55, ease: "back.out(1.6)" }, T);
    tl.to("#lrx-card", { rotation: o.cardTilt, duration: 0.4, ease: "power2.out" }, T + 0.4);
    tl.fromTo("#lrx-clip", { scale: 1 }, { scale: 1.1, duration: 3.2, ease: "sine.inOut" }, T);
    tl.from("#lrx-caption", { scale: 0.6, opacity: 0, duration: 0.3, ease: "back.out(2.2)" }, T + 0.7);
    tl.to("#lrx-face", { y: -24, scale: 1.04, duration: 0.25, ease: "power2.out" }, T + 1.1);
    tl.to("#lrx-face", { y: 0, scale: 1, duration: 0.5, ease: "power2.inOut" }, T + 1.35);
  }
</script>
