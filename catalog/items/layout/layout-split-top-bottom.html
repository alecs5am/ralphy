<!-- catalog item: layout-split-top-bottom (layout). Contract: function catalog_layout_split_top_bottom(tl, o)
     Two stacked video slots with a hook line in the top half and the caption on the seam. Params: split, seam, hook, caption, accent. -->
<style data-catalog-css>
  .lst-slot { position: absolute; left: 0; width: 1080px; overflow: hidden; }
  .lst-ph { position: absolute; inset: -40px; }
  .lst-top .lst-ph { background: radial-gradient(circle at 30% 35%, rgba(255,196,120,0.55), rgba(255,196,120,0) 55%), linear-gradient(160deg, #2b3a67 0%, #121a33 100%); }
  .lst-bottom .lst-ph { background: radial-gradient(circle at 70% 60%, rgba(120,220,190,0.5), rgba(120,220,190,0) 55%), linear-gradient(200deg, #1f4d45 0%, #0d1f1c 100%); }
  .lst-label { position: absolute; left: 80px; top: 60px; font-family: "Inter", sans-serif; font-weight: 600; font-size: 26px; letter-spacing: 4px; color: rgba(255,255,255,0.5); text-transform: uppercase; }
  .lst-seam { position: absolute; left: 0; width: 1080px; height: 8px; }
  .lst-hook { position: absolute; left: 80px; top: 270px; width: 880px; font-family: "Anton", "Impact", sans-serif; font-size: 96px; line-height: 1.02; color: #ffffff; text-transform: uppercase; text-shadow: 0 6px 24px rgba(0,0,0,0.45); }
  .lst-caption { position: absolute; left: 80px; width: 880px; text-align: center; font-family: "Montserrat", "Inter", sans-serif; font-weight: 900; font-size: 60px; line-height: 1.1; color: #ffffff; -webkit-text-stroke: 8px #0b0b0b; paint-order: stroke fill; }
</style>
<template data-catalog-markup>
  <div class="lst-slot lst-top" id="lst-top" data-slot="top"><div class="lst-ph" id="lst-top-ph"></div><div class="lst-label" data-safe-zone="ignore">Top video</div></div>
  <div class="lst-slot lst-bottom" id="lst-bottom" data-slot="bottom"><div class="lst-ph" id="lst-bottom-ph"></div><div class="lst-label" data-safe-zone="ignore">Bottom video</div></div>
  <div class="lst-seam" id="lst-seam"></div>
  <div class="lst-hook" id="lst-hook" data-slot="hook"></div>
  <div class="lst-caption" id="lst-caption" data-slot="caption" data-safe-zone="caption"></div>
</template>
<script data-catalog-js>
  function catalog_layout_split_top_bottom(tl, o) {
    var T = o.at, H = 1920, topH = Math.round(H * o.split), seamY = topH - 4;
    var top = document.getElementById("lst-top"), bottom = document.getElementById("lst-bottom");
    top.style.top = "0px"; top.style.height = topH + "px";
    bottom.style.top = topH + "px"; bottom.style.height = (H - topH) + "px";
    document.getElementById("lst-seam").style.top = seamY + "px";
    document.getElementById("lst-seam").style.backgroundColor = o.seam;
    document.getElementById("lst-hook").textContent = o.hook;
    var cap = document.getElementById("lst-caption");
    cap.textContent = o.caption;
    cap.style.top = Math.min(1300, Math.max(260, topH - 70)) + "px";
    cap.style.color = o.accent;
    tl.from("#lst-top", { yPercent: -100, duration: 0.6, ease: "expo.out" }, T);
    tl.from("#lst-bottom", { yPercent: 100, duration: 0.6, ease: "expo.out" }, T + 0.08);
    tl.from("#lst-seam", { scaleX: 0, duration: 0.45, ease: "power3.out" }, T + 0.4);
    tl.from("#lst-hook", { y: 60, opacity: 0, duration: 0.5, ease: "power3.out" }, T + 0.55);
    tl.from("#lst-caption", { scale: 0.6, opacity: 0, duration: 0.35, ease: "back.out(2.2)" }, T + 0.8);
    tl.fromTo("#lst-top-ph", { x: 0 }, { x: -30, duration: 3.2, ease: "none" }, T);
    tl.fromTo("#lst-bottom-ph", { x: 0 }, { x: 30, duration: 3.2, ease: "none" }, T);
  }
</script>
