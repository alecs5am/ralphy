<!-- catalog item: layout-pip (layout). Contract: function catalog_layout_pip(tl, o)
     Full-bleed main video with a rounded picture-in-picture window kept left of the engagement rail and above the caption block. Params: corner, size, caption, accent. -->
<style data-catalog-css>
  .lpp-main { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; overflow: hidden; }
  .lpp-main-ph { position: absolute; inset: -60px; background: radial-gradient(circle at 65% 30%, rgba(255,170,90,0.55), rgba(255,170,90,0) 50%), linear-gradient(170deg, #1e2a44 0%, #0b101c 100%); }
  .lpp-hill { position: absolute; left: -100px; width: 1400px; height: 700px; border-radius: 50%; }
  .lpp-pip { position: absolute; overflow: hidden; border-radius: 36px; border: 6px solid #ffffff; box-shadow: 0 24px 50px rgba(0,0,0,0.45); background: linear-gradient(160deg, #5d4a8a 0%, #2a1f45 100%); }
  .lpp-pip-face { position: absolute; left: 30%; top: 18%; width: 40%; height: 52%; border-radius: 48% 48% 44% 44%; background: #e7b994; }
  .lpp-caption { position: absolute; left: 80px; top: 280px; width: 880px; text-align: center; font-family: "Montserrat", "Inter", sans-serif; font-weight: 900; font-size: 62px; line-height: 1.1; color: #ffffff; -webkit-text-stroke: 8px #000000; paint-order: stroke fill; }
  .lpp-label { position: absolute; left: 600px; top: 1120px; font-family: "Inter", sans-serif; font-weight: 600; font-size: 26px; letter-spacing: 4px; color: rgba(255,255,255,0.55); text-transform: uppercase; }
</style>
<template data-catalog-markup>
  <div class="lpp-main" data-slot="main"><div class="lpp-main-ph" id="lpp-main-ph"></div>
    <div class="lpp-hill" style="top: 1250px; background: #24364f;"></div><div class="lpp-hill" style="top: 1420px; background: #1a2638;"></div>
    <div class="lpp-label" data-safe-zone="ignore">Main video</div>
  </div>
  <div class="lpp-pip" id="lpp-pip" data-slot="pip"><div class="lpp-pip-face" data-safe-zone="face"></div></div>
  <div class="lpp-caption" id="lpp-caption" data-slot="caption" data-safe-zone="caption"></div>
</template>
<script data-catalog-js>
  function catalog_layout_pip(tl, o) {
    var T = o.at, w = Math.round(o.size), h = Math.round(o.size * 1.3);
    var pip = document.getElementById("lpp-pip");
    pip.style.width = w + "px"; pip.style.height = h + "px";
    pip.style.left = "80px";
    pip.style.top = (o.corner === "top-left" ? 480 : 1420 - h) + "px";
    var cap = document.getElementById("lpp-caption");
    cap.textContent = o.caption;
    cap.style.color = o.accent;
    tl.fromTo("#lpp-main-ph", { scale: 1.0 }, { scale: 1.08, duration: 3.4, ease: "sine.inOut" }, 0);
    tl.from("#lpp-pip", { scale: 0.3, opacity: 0, transformOrigin: "0% 100%", duration: 0.5, ease: "back.out(1.8)" }, T + 0.2);
    tl.from("#lpp-caption", { y: -40, opacity: 0, duration: 0.4, ease: "power3.out" }, T + 0.55);
  }
</script>
