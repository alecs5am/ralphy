name: ✨ Feature request
description: A new capability or a meaningful change to an existing one.
labels: ["feature"]
body:
  - type: markdown
    attributes:
      value: |
        Quick check — is this already tracked?
        The [issue backlog](https://github.com/alecs5am/ralphy/tree/main/notes/issues) lives in-repo
        (flat top level = open work). For open-ended ideas, please use
        [Discussions](https://github.com/alecs5am/ralphy/discussions/new/choose) first.
  - type: textarea
    id: problem
    attributes:
      label: Problem you're solving
      description: What's painful today? Who else hits this?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: How should this work from the user's perspective? Sketch the CLI surface / config / output if applicable.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Workarounds you tried, other ways to solve it.
  - type: textarea
    id: related_issue
    attributes:
      label: Related issue (if any)
      placeholder: "notes/issues/085-some-slug.md"
