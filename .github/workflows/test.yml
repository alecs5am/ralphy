name: test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # SVG-rasterize tests (#037) launch a real headless Chromium via
      # playwright; without this step they fail with "Executable doesn't exist".
      - name: Cache Playwright Chromium
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('bun.lock') }}

      - name: Install Playwright Chromium
        run: bunx playwright install chromium --with-deps

      # --timeout 15000 matches package.json test scripts + the pre-commit hook.
      # bunfig.toml's [test] timeout is NOT honored by `bun test` (verified on
      # 1.2.22), and the 5s default kills cold CLI spawnSync tests on CI runners.
      - name: Run unit + integration tests
        run: bun test --timeout 15000 tests/unit/ tests/integration/
        env:
          # Tests use a fixture catalog and never hit the network.
          # Set placeholder env vars so any code path that reads them
          # doesn't trip on undefined.
          OPENROUTER_API_KEY: "test-placeholder"
          ELEVENLABS_API_KEY: "test-placeholder"

      - name: Lint error codes against catalog (01.06.01)
        run: bun run lint:errors

      - name: Lint landing examples vs --help (01.03.02)
        run: bun run lint:help-examples

      - name: Check CLI surface doc is current (01.10.01)
        run: bun run cli:surface:check

      - name: Check Mintlify CLI ref is current (07.03.02)
        run: bun run docs:cli:check

      - name: Lint docs internal links (07.09.01)
        run: bun run lint:docs-links:fast
