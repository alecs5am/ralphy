name: test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      # Pinned to the version developers run locally (`bun --version`). CI must
      # run what developers run, so bump this deliberately together with a local
      # upgrade — never via `latest`. The two bun-1.3 blockers that forced the
      # earlier 1.2.22 pin are fixed (#072): the mock.module leak in
      # analyze-video-logging (now fetch-stubbed) and the spawnSync+in-process
      # fixture-server deadlock in cli-ref-pull-bulk #048 (now async spawn via
      # tests/helpers/spawn-cli.ts). Suite is green on 1.3.14. History:
      # notes/issues/done/072-bun-1.3-test-incompatibilities.md.
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # SVG-rasterize tests (#037) launch a real headless Chromium via
      # playwright; without this step they fail with "Executable doesn't exist".
      - name: Cache Playwright Chromium
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('bun.lock') }}

      - name: Install Playwright Chromium
        run: bunx playwright install chromium --with-deps

      # --timeout 45000 matches package.json test scripts + the pre-commit hook.
      # bunfig.toml's [test] timeout is NOT honored by `bun test` (verified on
      # 1.2.22), and the 5s default kills cold CLI spawnSync tests on CI runners.
      # Raised 15000 -> 45000 (#061): the cli-dryrun*.test.ts spawnSync tests pass
      # in isolation (~1s) but get CPU/IO-starved past 15s under full-suite load,
      # intermittently failing the hooks. A real hang still surfaces at 45s.
      # studio/test/ is fast (~4s) + fixture-backed (no network) — gated here so
      # a Studio server-contract regression turns the badge red (#494, the
      # CI-wiring half; the husky-hook-executability half stays in #494).
      - name: Run unit + integration + studio tests
        run: bun test --timeout 45000 tests/unit/ tests/integration/ studio/test/
        env:
          # Tests use a fixture catalog and never hit the network.
          # Set placeholder env vars so any code path that reads them
          # doesn't trip on undefined.
          OPENROUTER_API_KEY: "test-placeholder"
          ELEVENLABS_API_KEY: "test-placeholder"

      - name: Lint error codes against catalog (01.06.01)
        run: bun run lint:errors

      - name: Lint landing examples vs --help (01.03.02)
        run: bun run lint:help-examples

      # Skill frontmatter shape (name/desc/namespace) + routing signal (#405):
      # every user-facing skill must carry an actionable trigger cue so the
      # router can bind an utterance to it. `lint:skills` chains both.
      - name: Lint skill frontmatter + routing signal (03.01 / #405)
        run: bun run lint:skills

      - name: Lint AGENTS.md routing table (03.05.01)
        run: bun run lint:agents-md

      # Every supported content mode (#413) must carry mode-specific quality
      # guidance: a linked guidelines/<slug>/ OR a docs/playbooks/modes/<mode>.md
      # playbook. Fails when a first-class route has zero coverage (#417).
      - name: Lint content-mode guideline coverage (#417)
        run: bun run lint:mode-guidelines

      # Consolidating completeness smoke (#446): every supported content mode is
      # run through a no-paid-generation fixture path (registry-derived brief →
      # routing → #418 contract → required artifacts + gates + Unit shape +
      # doc/guideline). Fails when a supported mode lacks any piece of the
      # contract. Run before changing mode routing.
      - name: Smoke supported content modes (#446)
        run: bun run smoke:modes

      # Every command verb that prints a structured shape via out({...}) must
      # have a canonical pretty-mode render assertion (issue #001 §A). Catches
      # the regression front that shipped `installed  [object Object]`.
      - name: Lint pretty-mode out() coverage (#001)
        run: bun run lint:out-coverage

      # English-only-on-disk gate (#465): fails on any Cyrillic in a tracked
      # text file outside the documented translation-debt allowlist.
      - name: Lint no-Cyrillic (#465)
        run: bun run lint:no-cyrillic

      - name: Check CLI surface doc is current (01.10.01)
        run: bun run cli:surface:check

      - name: Check Mintlify CLI ref is current (07.03.02)
        run: bun run docs:cli:check

      - name: Lint docs internal links (07.09.01)
        run: bun run lint:docs-links:fast

      # Library QA (#448): schema completeness + referential integrity for every
      # Unit/Block/Blueprint in landing/lib/library-v2/library.json. Fast path
      # (no media probe) so a broken record fails CI; the slow path
      # (lint:library) probes media URLs.
      - name: Lint content library QA (#448)
        run: bun run lint:library:fast
